spring.application.name=auth-service
server.port=8081

# ATENTIE: nicio parola / cheie reala in acest fisier - el ajunge pe Git.
# Valorile reale se pun in application-local.properties (ignorat de Git)
# sau in variabile de mediu. Vezi application-local.properties.example
spring.profiles.active=local

# PostgreSQL - auth_db
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:*****}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT - cheia de semnare se pune local, nu aici
jwt.secret=${JWT_SECRET:*****}
jwt.expiration=86400000

# Gmail SMTP (genereaza un App Password din myaccount.google.com/apppasswords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:*****}
spring.mail.password=${MAIL_PASSWORD:*****}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Cod verificare
verification.code.expiration.minutes=10
