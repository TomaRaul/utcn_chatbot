spring.application.name=chatbot-facultate
server.port=8080

# ATENTIE: nicio parola reala in acest fisier - el ajunge pe Git.
# Valorile reale se pun in application-local.properties (ignorat de Git)
# sau in variabile de mediu. Vezi application-local.properties.example
spring.profiles.active=local

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/chatbot_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:*****}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ollama
ollama.base-url=http://localhost:11434
ollama.model=llama3.2
ollama.embedding-model=nomic-embed-text
